name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Tests
        run: go test ./...

      - name: Build Binaries
        run: make build-all

      - name: Package KWin Script
        run: |
          cd kwin_script
          zip -r ../bin/kde-screentime-tracker.zip .
          cd ..
          mv bin/kde-screentime-tracker.zip \
             bin/kde-screentime-tracker.kwinscript

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
